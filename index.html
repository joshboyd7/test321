<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Metro & County PageRank Viewer</title>
  <link
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    rel="stylesheet"
  />
  <style>
    html,body,#map { height: 100%; margin: 0 }
    #control-panel {
      position: absolute; z-index: 1000; top: 10px; left: 10px;
      background: #fff; padding: 12px 16px; border-radius: 6px;
      font-family: system-ui, sans-serif; font-size: 14px; box-shadow: 0 1px 6px rgba(0,0,0,.2);
      max-width: 280px;
    }
    #control-panel h2 { margin: 8px 0 4px; font-size: 14px }
    #control-panel select, #control-panel input {
      width: 100%; margin-bottom: 6px; padding: 4px
    }
    .hidden { display: none }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- control panel -->
  <div id="control-panel">
    <h2>Geography</h2>
    <label><input type="radio" name="geography" value="metro" checked> Metro (CBSA)</label>
    <label><input type="radio" name="geography" value="county"> County</label>

    <!-- Metro-only controls -->
    <div id="metro-options">
      <h2>Source</h2>
      <select id="metro-source-select">
        <option value="acs" selected>ACS</option>
        <option value="irs">IRS</option>
      </select>

      <h2>Filter By</h2>
      <select id="filter-type-select">
        <option value="none" selected>-- choose --</option>
        <option value="total">Total Flow</option>
        <option value="race">Race</option>
        <option value="age">Age</option>
        <option value="education">Education</option>
        <option value="industry">Industry 2-digit&nbsp;NAICS</option>
      </select>

      <!-- sub-filters -->
      <label id="total-wrapper" class="hidden">Total Flow Type
        <select id="total-select">
          <option value="HH">Household</option>
          <option value="PER">Person</option>
        </select>
      </label>

      <label id="race-wrapper" class="hidden">Race
        <select id="race-select">
          <option value="Black">Black</option>
          <option value="White">White</option>
          <option value="Hispanic">Hispanic</option>
        </select>
      </label>

      <label id="age-wrapper" class="hidden">Age
        <select id="age-select">
          <option value="25_35">25–35</option>
          <option value="35_65">35–65</option>
          <option value="65plus">65+</option>
        </select>
      </label>

      <label id="educ-wrapper" class="hidden">Education
        <select id="educ-select">
          <option value="NoCollege">No College</option>
          <option value="WithCollege">College Grad</option>
        </select>
      </label>

      <label id="industry-wrapper" class="hidden">Industry code
        <input id="industry-input" maxlength="2" placeholder="e.g. 23" />
      </label>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
