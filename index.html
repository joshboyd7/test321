
<!-- Metro-level controls -->
<div id="metro-options">
  <h2>ACS Filter</h2>

  <label>Filter by
    <select id="filter-type-select">
      <option value="none" selected>-- choose --</option>
      <option value="race">Race</option>
      <option value="age">Age Group</option>
      <option value="education">Education</option>
      <option value="industry">Industry (2-digit NAICS)</option>
      <option value="total">Total Flow</option>
    </select>
  </label>

  <label id="race-wrapper" class="hidden">Race
    <select id="race-select">
      <option value="Black">Black</option>
      <option value="White">White</option>
      <option value="Hispanic">Hispanic</option>
    </select>
  </label>

  <label id="age-wrapper" class="hidden">Age Group
    <select id="age-select">
      <option value="25-35">25–35</option>
      <option value="35-65">35–65</option>
      <option value="65plus">65+</option>
    </select>
  </label>

  <label id="educ-wrapper" class="hidden">Education
    <select id="educ-select">
      <option value="NoCollege">No College</option>
      <option value="WithCollege">With College</option>
    </select>
  </label>

  <label id="industry-wrapper" class="hidden">Industry (2-digit NAICS)
    <input type="text" id="industry-input" placeholder="e.g. 23" maxlength="4" />
  </label>

  <label id="total-wrapper" class="hidden">Total Flow Type
    <select id="total-select">
      <option value="HH">Households</option>
      <option value="PER">Persons</option>
    </select>
  </label>
</div>
